<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light p-5">
<div class="container card shadow p-4" style="max-width: 400px;">
    <h4>Estado del Chofer</h4>
    <form id="f-chofer">
        <input type="number" id="cId" class="form-control mb-3" placeholder="ID del Chofer" required>
        <select id="cEstado" class="form-select mb-3">
            <option value="Activo">Activo</option>
            <option value="Suspendido">Suspendido</option>
        </select>
        <button type="submit" class="btn btn-success w-100 mb-2">Actualizar</button>
        <a href="admin_menu.html" class="btn btn-secondary w-100">Volver</a>
    </form>
</div>
<script>
document.getElementById("f-chofer").addEventListener("submit", function(e) {
    e.preventDefault();
    fetch('http://127.0.0.1:5000/api/admin/choferes', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: document.getElementById("cId").value, estado: document.getElementById("cEstado").value })
    }).then(res => res.json()).then(data => alert(data.mensaje));
});
</script>
</body>
</html>
