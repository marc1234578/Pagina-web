<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIJOS DE CRISTO REY - Ayuda y Quejas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at top right, #f8f9fa 0%, #e9ecef 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }
        .form-control:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 0.25rem rgba(100, 116, 139, 0.15);
        }
    </style>
</head>

<body class="d-flex flex-column justify-content-between">

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="container my-auto py-5" style="max-width: 800px;">

        <!-- ENLACE VOLVER AL MENÚ -->
        <div class="mb-4">
            <a href="menu.html" class="text-decoration-none fw-medium d-inline-flex align-items-center" style="color: #64748b; transition: color 0.2s;" onmouseover="this.style.color='#1e293b'" onmouseout="this.style.color='#64748b'">
                <i class="fa-solid fa-arrow-left-long me-2"></i> Volver al panel principal
            </a>
        </div>

        <!-- ENCABEZADO DEL BUZÓN -->
        <div class="mb-5 text-center text-md-start">
            <div class="d-flex flex-column flex-md-row align-items-center gap-3 mb-2 justify-content-center justify-content-md-start">
                <div class="fs-1 text-secondary"><i class="fa-solid fa-circle-question"></i></div>
                <h1 class="fw-bold h2 mb-0" style="color: #1e293b;">Buzón de Ayuda y Quejas</h1>
            </div>
            <p class="text-muted small text-uppercase tracking-wider mb-0" style="letter-spacing: 1px;">Tu opinión nos importa. Ayúdanos a mejorar tu experiencia.</p>
        </div>

        <!-- TARJETA DEL FORMULARIO -->
        <div class="card shadow-sm border border-light p-4 p-md-5 bg-white mb-5" style="border-radius: 18px;">
            <h4 class="h6 fw-bold mb-4" style="color: #475569;"><i class="fa-solid fa-pen-to-square me-2"></i>Cuéntanos qué sucedió:</h4>
            
            <form id="form-quejas">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-floating mb-2">
                            <input type="text" class="form-control" id="floatingName" placeholder="Tu nombre" style="border-radius: 10px;" required>
                            <label for="floatingName" class="text-secondary">Nombre Completo</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating mb-2">
                            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" style="border-radius: 10px;" required>
                            <label for="floatingInput" class="text-secondary">Correo Electrónico de Contacto</label>
                        </div>
                    </div>
                </div> 
                
                <div class="col-12 mt-3">
                    <div class="form-floating">
                        <textarea class="form-control" placeholder="Detalla tu reclamo o sugerencia" id="floatingTextarea2" style="height: 150px; border-radius: 10px;" required></textarea>
                        <label for="floatingTextarea2" class="text-secondary">Escribe detalladamente tu queja o sugerencia aquí...</label>
                    </div>
                </div>
                
                <div class="text-center pt-4">
                    <button type="submit" class="btn btn-dark w-100 fw-medium py-25 shadow-sm" style="font-size: 0.95rem; letter-spacing: 1px; border-radius: 10px; background-color: #1e293b;">
                        <i class="fa-solid fa-paper-plane me-2"></i> ENVIAR REPORTE
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- FOOTER CORPORATIVO -->
    <footer class="main-footer text-white" style="background-color: #1e293b;"> 
        <div class="container py-5 text-center">
            <div class="h5 pb-2 mb-3 border-bottom border-secondary d-inline-block mx-auto fw-bold text-uppercase tracking-wider" style="letter-spacing: 2px;">
                HIJOS DE CRISTO REY - SJL
            </div>
            
            <p class="text-muted small mb-4">Servicio de transporte público seguro, confiable y moderno.</p>
            
            <div class="h6 pb-2 mb-3 border-bottom border-secondary d-inline-block mx-auto text-muted small text-uppercase">
                Nuestras Redes
            </div>
            
            <div class="d-flex gap-4 justify-content-center mt-2 mb-4">
                <a href="#" class="text-white-50 text-decoration-none fs-3 transition-all" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#rgba(255,255,255,0.5)'"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-white-50 text-decoration-none fs-3 transition-all" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#rgba(255,255,255,0.5)'"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-white-50 text-decoration-none fs-3 transition-all" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#rgba(255,255,255,0.5)'"><i class="bi bi-tiktok"></i></a>
                <a href="#" class="text-white-50 text-decoration-none fs-3 transition-all" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#rgba(255,255,255,0.5)'"><i class="bi bi-whatsapp"></i></a>
            </div>
            
            <p class="mb-0 text-muted" style="font-size: 0.8rem;">
                © 2026 HIJOS DE CRISTO REY tiene los derechos reservados.
            </p>
        </div>
    </footer>

    <!-- Bootstrap Bundle Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Tu script original intacto -->
    <script>
        document.getElementById('form-quejas').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const nombre = document.getElementById('floatingName').value;
            const correo = document.getElementById('floatingInput').value;
            const detalle = document.getElementById('floatingTextarea2').value;

            fetch('http://127.0.0.1:5000/api/quejas', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    nombre: nombre,
                    correo: correo,
                    detalle: detalle
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('✅ ¡Reporte enviado y guardado con éxito!');
                    document.getElementById('form-quejas').reset(); 
                } else {
                    alert('❌ Error del servidor: ' + data.mensaje);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('⚠️ No se pudo conectar con Python.');
            });
        });
    </script>
</body>
</html>
