<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Carreras Privadas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="admin-body">
<div class="admin-shell">
    <aside class="sidebar">
        <div class="brand-box"><div class="brand-icon"><i class="fa-solid fa-van-shuttle"></i></div><div><div class="brand-title">Hijos de<br>Cristo Rey</div><div class="brand-subtitle">Panel administrativo</div></div></div>
        <nav class="nav-admin">
            <a href="admin_menu.html"><i class="fa-solid fa-chart-pie"></i>Resumen</a>
            <a href="admin_tarifas.html"><i class="fa-solid fa-wallet"></i>Tarifas</a>
            <a href="admin_choferes.html"><i class="fa-solid fa-id-card"></i>Choferes</a>
            <a href="admin_novedades.html"><i class="fa-solid fa-bullhorn"></i>Novedades</a>
            <a href="admin_quejas.html"><i class="fa-solid fa-inbox"></i>Quejas</a>
            <a href="admin_carreras.html" class="active"><i class="fa-solid fa-route"></i>Carreras privadas</a>
        </nav>
        <div class="sidebar-footer"><a class="logout-btn" href="index.html"><i class="fa-solid fa-right-from-bracket"></i>Cerrar sesión</a></div>
    </aside>

    <main class="admin-main">
        <section class="topbar">
            <div>
                <div class="page-eyebrow">Solicitudes especiales</div>
                <h1 class="page-title">Carreras privadas</h1>
                <p class="page-desc">Consulta el estado de cada solicitud y el conductor que aceptó la carrera.</p>
            </div>
            <button class="btn-soft" onclick="cargarCarreras()"><i class="fa-solid fa-rotate"></i>Actualizar</button>
        </section>

        <section class="data-panel">
            <div class="table-responsive">
                <table class="table-professional">
                    <thead><tr><th>ID</th><th>Cliente</th><th>Origen</th><th>Destino</th><th>Monto</th><th>Estado</th><th>Chofer asignado</th><th>Fecha</th></tr></thead>
                    <tbody id="tablaCarreras"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<div class="toast-admin" id="toast"></div>
<script>
const API = 'http://127.0.0.1:5000';
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3200); }
function money(v) { return `S/ ${Number(v || 0).toFixed(2)}`; }
function badgeEstado(estado) { const k = String(estado || '').toLowerCase(); const cls = k === 'aceptada' ? 'badge-aceptada' : k === 'pendiente' ? 'badge-pendiente' : 'badge-cancelada'; return `<span class="badge-soft ${cls}">${estado || 'Sin estado'}</span>`; }
function filaVacia(msg) { return `<tr><td colspan="8"><div class="empty-state"><i class="fa-solid fa-car-side"></i>${msg}</div></td></tr>`; }
async function cargarCarreras() {
    try {
        const res = await fetch(`${API}/api/admin/carreras-privadas`);
        const data = await res.json();
        if (data.status !== 'success') throw new Error(data.mensaje);
        const carreras = data.datos || [];
        const tbody = document.getElementById('tablaCarreras');
        if (!carreras.length) { tbody.innerHTML = filaVacia('No hay carreras privadas registradas.'); return; }
        tbody.innerHTML = carreras.map(c => `
            <tr>
                <td class="fw-bold">#${c.id_solicitud}</td>
                <td><div>${c.nombre_cliente || 'Cliente no indicado'}</div><div class="text-muted small">${c.telefono_cliente || '-'}</div></td>
                <td>${c.direccion_origen}</td>
                <td>${c.direccion_destino}</td>
                <td class="fw-bold">${money(c.monto_ofrecido)}</td>
                <td>${badgeEstado(c.estado_solicitud)}</td>
                <td>${c.chofer_nombre ? `<strong>${c.chofer_nombre}</strong><div class="text-muted small">Placa: ${c.chofer_placa || '-'}</div>` : '<span class="text-muted">Sin asignar</span>'}</td>
                <td>${c.fecha_registro ? new Date(c.fecha_registro).toLocaleString() : '-'}</td>
            </tr>`).join('');
    } catch (e) { toast('Error: ' + e.message); }
}
cargarCarreras();
</script>
</body>
</html>
