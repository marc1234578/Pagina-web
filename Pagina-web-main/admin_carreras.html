<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light p-5">
<div class="container card shadow p-4">
    <div class="d-flex justify-content-between mb-3"><h4>Carreras Privadas Activas</h4><a href="admin_menu.html" class="btn btn-secondary">Volver</a></div>
    <table class="table">
        <thead><tr><th>ID</th><th>Origen</th><th>Destino</th><th>Monto Ofrecido</th></tr></thead>
        <tbody id="t-carreras"></tbody>
    </table>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    fetch('http://127.0.0.1:5000/api/admin/carreras-privadas').then(res => res.json()).then(data => {
        document.getElementById("t-carreras").innerHTML = data.datos.map(c => `<tr><td>#${c.id}</td><td>${c.direccion_origen}</td><td>${c.direccion_destino}</td><td>S/ ${c.monto_ofrecido}</td></tr>`).join('');
    });
});
</script>
</body>
</html>
