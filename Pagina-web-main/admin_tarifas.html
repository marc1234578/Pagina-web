<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light p-5">
<div class="container card shadow p-4" style="max-width: 400px;">
    <h4>Actualizar Tarifas</h4>
    <form id="f-tarifa">
        <input type="number" id="tId" class="form-control mb-3" placeholder="ID de la ruta" required>
        <input type="number" step="0.10" id="tMonto" class="form-control mb-3" placeholder="Nuevo Monto (S/)" required>
        <button type="submit" class="btn btn-primary w-100 mb-2">Guardar</button>
        <a href="admin_menu.html" class="btn btn-secondary w-100">Volver</a>
    </form>
</div>
<script>
document.getElementById("f-tarifa").addEventListener("submit", function(e) {
    e.preventDefault();
    fetch('http://127.0.0.1:5000/api/admin/tarifas', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: document.getElementById("tId").value, monto: document.getElementById("tMonto").value })
    }).then(res => res.json()).then(data => alert(data.mensaje));
});
</script>
</body>
</html>
