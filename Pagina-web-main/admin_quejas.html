<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Quejas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="admin-body">
<div class="admin-shell">
    <aside class="sidebar">
        <div class="brand-box"><div class="brand-icon"><i class="fa-solid fa-van-shuttle"></i></div><div><div class="brand-title">Hijos de<br>Cristo Rey</div><div class="brand-subtitle">Panel administrativo</div></div></div>
        <nav class="nav-admin">
            <a href="admin_menu.html"><i class="fa-solid fa-chart-pie"></i>Resumen</a>
            <a href="admin_tarifas.html"><i class="fa-solid fa-wallet"></i>Tarifas</a>
            <a href="admin_choferes.html"><i class="fa-solid fa-id-card"></i>Choferes</a>
            <a href="admin_novedades.html"><i class="fa-solid fa-bullhorn"></i>Novedades</a>
            <a href="admin_quejas.html" class="active"><i class="fa-solid fa-inbox"></i>Quejas</a>
            <a href="admin_carreras.html"><i class="fa-solid fa-route"></i>Carreras privadas</a>
        </nav>
        <div class="sidebar-footer"><a class="logout-btn" href="index.html"><i class="fa-solid fa-right-from-bracket"></i>Cerrar sesión</a></div>
    </aside>

    <main class="admin-main">
        <section class="topbar">
            <div>
                <div class="page-eyebrow">Atención al usuario</div>
                <h1 class="page-title">Buzón de quejas</h1>
                <p class="page-desc">Visualiza todos los mensajes enviados por los usuarios y marca su avance.</p>
            </div>
            <button class="btn-soft" onclick="cargarQuejas()"><i class="fa-solid fa-rotate"></i>Actualizar</button>
        </section>

        <section class="data-panel">
            <div class="table-responsive">
                <table class="table-professional">
                    <thead><tr><th>ID</th><th>Usuario</th><th>Correo</th><th>Detalle</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr></thead>
                    <tbody id="tablaQuejas"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<div class="toast-admin" id="toast"></div>
<script>
const API = 'http://127.0.0.1:5000';
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3200); }
function badgeEstado(estado) { const k = String(estado || '').toLowerCase(); const cls = k === 'atendido' ? 'badge-atendido' : k === 'pendiente' ? 'badge-pendiente' : 'badge-default'; return `<span class="badge-soft ${cls}">${estado || 'Sin estado'}</span>`; }
function filaVacia(msg) { return `<tr><td colspan="7"><div class="empty-state"><i class="fa-solid fa-inbox"></i>${msg}</div></td></tr>`; }
async function cargarQuejas() {
    try {
        const res = await fetch(`${API}/api/admin/quejas`);
        const data = await res.json();
        if (data.status !== 'success') throw new Error(data.mensaje);
        const quejas = data.datos || [];
        const tbody = document.getElementById('tablaQuejas');
        if (!quejas.length) { tbody.innerHTML = filaVacia('No hay quejas registradas.'); return; }
        tbody.innerHTML = quejas.map(q => `
            <tr>
                <td class="fw-bold">#${q.id}</td>
                <td>${q.nombre_completo || 'Anónimo'}</td>
                <td>${q.usuario_correo || '-'}</td>
                <td style="max-width:360px;">${q.descripcion || '-'}</td>
                <td>${q.fecha_registro ? new Date(q.fecha_registro).toLocaleString() : '-'}</td>
                <td>${badgeEstado(q.estado)}</td>
                <td>
                    <select class="form-select" onchange="actualizarEstado(${q.id}, this.value)">
                        <option ${q.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                        <option ${q.estado === 'En revisión' ? 'selected' : ''}>En revisión</option>
                        <option ${q.estado === 'Atendido' ? 'selected' : ''}>Atendido</option>
                    </select>
                </td>
            </tr>`).join('');
    } catch (e) { toast('Error: ' + e.message); }
}
async function actualizarEstado(id, estado) {
    const res = await fetch(`${API}/api/admin/quejas/${id}/estado`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({estado}) });
    const data = await res.json();
    toast(data.mensaje);
    cargarQuejas();
}
cargarQuejas();
</script>
</body>
</html>
