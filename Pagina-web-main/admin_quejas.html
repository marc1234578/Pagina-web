<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light p-5">
<div class="container card shadow p-4">
    <div class="d-flex justify-content-between mb-3"><h4>Buzón de Quejas</h4><a href="admin_menu.html" class="btn btn-secondary">Volver</a></div>
    <table class="table">
        <thead><tr><th>ID</th><th>Correo</th><th>Descripción</th></tr></thead>
        <tbody id="t-quejas"></tbody>
    </table>
</div>
<script>
document.addEventListener("DOMContentLoaded", function() {
    fetch('http://127.0.0.1:5000/api/admin/quejas').then(res => res.json()).then(data => {
        document.getElementById("t-quejas").innerHTML = data.datos.map(q => `<tr><td>${q.id}</td><td>${q.usuario_correo || 'Anónimo'}</td><td>${q.descripcion}</td></tr>`).join('');
    });
});
</script>
</body>
</html>
