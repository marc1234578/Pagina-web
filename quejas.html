<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayuda y Quejas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="body-quejas carta-imagenfondo">

    <div id="pantalla-quejas">

        <header>
            <div class="container-fluid text-center text-light py-4 barra-logo">
                <div class="row align-items-center">
                    <div class="col-12 text-center">
                        <a class="navbar-brand fw-light text-uppercase text-light text-decoration-none" href="menu.html" style="letter-spacing: 5px; font-size: 1.8rem;">
                            <span class="fw-bold">HIJOS DE CRISTO REY</span>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <main>

            <!-- boton de volver -->
            <div class="volver d-flex justify-content-start ms-5"> <a href="menu.html" class="btn-volver">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </a>
            </div>

            <section class="fondo-tema py-5 mb-3">
                <div class="container">
                    <div class="row justify-content-center text-center">
                        <div class="col-md-8">
                            <h1 class="display-4 fw-bold">
                                Buzón de <span class="texto-destacado">AYUDA Y QUEJAS</span>
                            </h1>
                            <p class="lead texto-secundario text-uppercase">
                                Tu opinión nos importa. Ayúdanos a mejorar tu experiencia.
                            </p>
                            <hr class="linea-separadora">
                        </div>
                    </div>
                </div>
            </section>


            <!-- Tarjeta -->
        <div class="container py-5">
                <div class="card mb-3 text-light border-0 carta-ayuda bg-transparent"> 
                    <div class="row g-0"> 
                        <div class="col-12">
                            <div class="card-body p-4 p-md-5"> 
                                <h4 class="card-title text-center text-md-start">Cuéntanos qué sucedió :</h4>
                                <hr class="border-light border-2 opacity-25 w-25 mb-4">
                                
                                <form id="form-quejas">
                                    
                                    <div class="row">
                                        <div class="col-md-6 text-dark">
                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control" id="floatingName" placeholder="Tu nombre" required>
                                                <label for="floatingName">Nombre Completo</label>
                                            </div>
                                        </div>
                                        <div class="col-md-6 text-dark">
                                            <div class="form-floating mb-3">
                                                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
                                                <label for="floatingInput">Correo Electrónico de Contacto</label>
                                            </div>
                                        </div>
                                    </div> 
                                    
                                    <div class="col text-dark py-2">
                                        <div class="form-floating">
                                            <textarea class="form-control" placeholder="Detalla tu reclamo o sugerencia" id="floatingTextarea2" style="height: 150px" required></textarea>
                                            <label for="floatingTextarea2">Escribe detalladamente tu queja o sugerencia aquí...</label>
                                        </div>
                                    </div>
                                    
                                    <div class="text-center pt-4">
                                        <button type="submit" class="btn btn-danger w-50 fw-bold py-2" style="font-size: 0.9rem; letter-spacing: 1px;">ENVIAR REPORTE</button>
                                    </div>

                                </form>
                                </div>
                        </div>
                    </div>
                </div>
            </div>

    <!-- footer -->
    <footer class="main-footer mt-5 text-white"> <div class="container-fluid p-0">
            <div class="card mb-0 border-0 rounded-0 bg-transparent text-white"> 
                <div class="row g-0 justify-content-center py-5 w-100"> 
                    <div class="col-md-10 text-center">
                        <div class="card-body">
                            
                            <div class="h4 pb-2 mb-4 text-white border-bottom border-light d-inline-block mx-auto">
                                HIJOS DE CRISTO REY - SJL
                            </div>
                            
                            <p class="card-text mb-5 text-white-50">Agregar datos faltantes en esta parte.................</p>
                            
                            <div class="h4 pb-2 mb-4 text-white border-bottom border-light d-inline-block mx-auto">
                                Nuestras Redes
                            </div>
                            
                            <div class="d-flex gap-4 justify-content-center mt-3 mb-5">
                                <a href="#" class="text-white fs-2"><i class="bi bi-facebook"></i></a>
                                <a href="#" class="text-white fs-2"><i class="bi bi-instagram"></i></a>
                                <a href="#" class="text-white fs-2"><i class="bi bi-tiktok"></i></a>
                                <a href="#" class="text-white fs-2"><i class="bi bi-whatsapp"></i></a>
                            </div>
                            
                            <p class="card-text mt-3">
                                <small class="text-white-50">© 2026 HIJOS DE CRISTO REY tiene los derechos reservados.</small>
                            </p>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('form-quejas').addEventListener('submit', function(event) {
            event.preventDefault(); // ¡Esta línea mágica evita el parpadeo!

            // 1. Capturamos los datos
            const nombre = document.getElementById('floatingName').value;
            const correo = document.getElementById('floatingInput').value;
            const detalle = document.getElementById('floatingTextarea2').value;

            // 2. Los lanzamos a Python por el puerto 5000
            fetch('http://127.0.0.1:5000/api/quejas', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    nombre: nombre,
                    correo: correo,
                    detalle: detalle
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('✅ ¡Reporte enviado y guardado con éxito!');
                    document.getElementById('form-quejas').reset(); // Limpia los campos
                } else {
                    alert('❌ Error del servidor: ' + data.mensaje);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('⚠️ No se pudo conectar con Python.');
            });
        });
    </script>
</body>
</html>
