<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #f4f6f9;
        }

        .contenedor{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-registro{
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="card shadow card-registro">

        <h2 class="text-center mb-4">
            Registro de Usuario
        </h2>

        <form>

            <div class="mb-3">
                <input type="text"
                       class="form-control"
                       placeholder="Nombres"
                       required>
            </div>

            <div class="mb-3">
                <input type="text"
                       class="form-control"
                       placeholder="Apellidos"
                       required>
            </div>

            <div class="mb-3">
                <input type="tel"
                       class="form-control"
                       placeholder="Teléfono"
                       required>
            </div>

            <div class="mb-3">
                <input type="email"
                       class="form-control"
                       placeholder="Correo Electrónico"
                       required>
            </div>

            <div class="mb-3">
                <input type="password"
                       class="form-control"
                       placeholder="Contraseña"
                       required>
            </div>

            <div class="mb-4">
                <input type="password"
                       class="form-control"
                       placeholder="Confirmar Contraseña"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-primary w-100 mb-3">
                Registrarse
            </button>

            <a href="index.html"
               class="btn btn-secondary w-100">
                ← Regresar al Inicio
            </a>

        </form>

    </div>

</div>

</body>
</html>
