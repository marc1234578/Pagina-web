<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>Empresa de Transportes</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5),
            rgba(168, 19, 19, 0.5)),
            url('carro.jpeg');

            background-size: cover;
             margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .inicio{
            text-align: center;
            color: white;
        }

        .inicio h1{
            font-size: 60px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .inicio p{
            font-size: 20px;
            margin-bottom: 30px;
        }

        .btn-entrar{
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            background: #00b894;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-entrar:hover{
            background: #019875;
            transform: scale(1.05);
        }

    </style>

</head>
<body>

    <div class="inicio">

        <h1>
            <i class="fa-solid fa-van-shuttle"></i>
             HIJOS DE CRISTO REY
        </h1>

        <p>
            Transporte seguro, rápido y confiable
        </p>

        <a href="./menu.html">
            <button class="btn-entrar">
                Entrar
            </button>
        </a>

    </div>

</body>

</html>
